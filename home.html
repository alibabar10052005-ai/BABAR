<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Iron Valley - Rob Cleapor</title>
    <link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

    <link rel="stylesheet" href="home.css">
</head>

<body>

<div class="website">

    <!-- SIDEBAR -->
    <aside class="sidebar">

        <div class="brand">

            <div class="iron-logo">
                <span>IRON</span>
                <strong>VALLEY</strong>
            </div>

            <small>REAL ESTATE</small>

        </div>


        <nav class="navigation">

            <a href="index.html" class="nav-link active">
                HOME
            </a>

            <a href="buyers.html" class="nav-link" target="_blank">
                BUYERS
            </a>

            <a href="sellers.html" class="nav-link" target="_blank">
                SELLERS
            </a>

            <a href="resources.html" class="nav-link" target="_blank">
                VALUABLE RESOURCES
            </a>

            <a href="contact.html" class="nav-link" target="_blank">
                CONTACT ME
            </a>

            <a href="home-finder.html" class="nav-link" target="_blank">
                MY HOME FINDER
            </a>

            <a href="notifications.html" class="nav-link" target="_blank">
                PROPERTY NOTIFICATIONS
            </a>

        </nav>


        <!-- SOCIAL -->
        <div class="social">

            <div class="social">

    <a href="#">
        <i class="fa-brands fa-facebook-f"></i>
    </a>

    <a href="#">
        <i class="fa-brands fa-x-twitter"></i>
    </a>

    <a href="#">
        <i class="fa-brands fa-instagram"></i>
    </a>

    <a href="#">
        <i class="fa-brands fa-linkedin-in"></i>
    </a>

</div>
        </div>

    </aside>


    <!-- MAIN CONTENT -->
    <main class="main-content">


        <!-- HERO -->
        <section class="hero">

            <!-- HOUSE -->
            <img
                src="images/house.jpeg"
                class="house-image"
                alt="House"
            >


            <!-- DARK OVERLAY -->
            <div class="hero-overlay"></div>


            <!-- PERSON -->
            <img
                src="images/logo.png"
                class="agent-image"
                alt="Rob Cleapor"
            >


            <!-- NAME -->
            <div class="agent-name">

                <span>ROB</span>
                <strong>Cleapor</strong>

            </div>


            <!-- SEARCH -->
            <div class="hero-search">

                <h2>FIND YOUR NEXT HOME</h2>

                <div class="search-box">

                    <input
                        type="text"
                        id="propertySearch"
                        placeholder="City and State, Subdivision, Zip, or MLS#"
                    >

                    <button id="searchButton">
                        <i class="fa-solid fa-location-dot"></i>
                    </button>

                </div>

            </div>

        </section>



        <!-- BOTTOM SECTION -->
        <section class="bottom-section">


            <!-- NEWEST LISTINGS -->
            <div class="new-listings">

                <div class="bottom-content">

                    <h2>
                        Get the Newest Listings
                    </h2>

                    <p>
                        On the market in the last 60 minutes
                    </p>

                    <a
                        href="mailto:robcleapor@example.com?subject=Newest Listings"
                        class="orange-button"
                    >
                        SIGN UP NOW
                    </a>

                </div>

            </div>



            <!-- HOME WORTH -->
            <div class="home-worth">

                <div class="worth-content">

                    <h2>
                        What's Your Home Worth
                    </h2>

                    <p>
                        Get an estimate on the value of your home
                    </p>


                    <div class="worth-form">

                        <input
                            type="text"
                            id="address"
                            placeholder="Enter an address"
                        >


                        <select id="unit">

                            <option value="">
                                Unit
                            </option>

                            <option value="house">
                                House
                            </option>

                            <option value="apartment">
                                Apartment
                            </option>

                        </select>


                        <button id="worthButton">
                             <i class="fa-solid fa-magnifying-glass"></i>
                        </button>

                    </div>

                </div>

            </div>

        </section>


        <!-- EMAIL
        <div class="email">
 <i class="fa-solid fa-envelope"></i>
            <a href="mailto:robcleapor@example.com">
                Email: robcleapor@example.com
            </a>

        </div> -->


    </main>

</div>


<script src="script.js"></script>

</body>
</html>
